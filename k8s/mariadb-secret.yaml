apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  namespace: quotehub
type: Opaque
data:
  # Base64 encoded values from environment variables
  # Use: echo -n "your_value" | base64 to generate base64 values
  MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD_B64}
  MARIADB_DATABASE: ${MARIADB_DATABASE_B64}
  MARIADB_USER: ${MARIADB_USER_B64}
  MARIADB_PASSWORD: ${MARIADB_PASSWORD_B64} 